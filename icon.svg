      <path d="M204,340 Q202,382 200,398 Q209,401 219,401 Q229,401 238,398 Q236,382 234,340 Q228,335 219,334 Q210,335 204,340Z"/>
      <path d="M204,398 Q200,420 197,441 Q203,443 210,443 Q213,434 219,422 Q225,434 228,443 Q235,443 241,441 Q238,420 234,398Z"/>
      <path d="M204,348 Q193,362 191,376 Q197,378 200,374 Q202,362 205,351Z"/>
