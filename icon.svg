      <path d="M325,346 Q313,360 311,375 Q317,377 321,373 Q323,360 326,349Z"/>
      <!-- right arm (holding pole) -->
      <path d="M355,346 Q364,358 365,372 Q360,374 357,371 Q355,358 353,349Z"/>
