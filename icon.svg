    <!-- Birds -->
    <path d="M334,116 Q341,108 349,116" stroke="#182535" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M353,103 Q361,95 370,103" stroke="#182535" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M374,120 Q380,113 387,120" stroke="#182535" stroke-width="3" fill="none" stroke-linecap="round"/>
