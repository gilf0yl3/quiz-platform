<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c05818"/>
      <stop offset="40%" stop-color="#e8782b"/>
      <stop offset="100%" stop-color="#f5b05a"/>
    </linearGradient>
    <clipPath id="rr">
      <rect width="512" height="512" rx="108" ry="108"/>
    </clipPath>
  </defs>

  <!-- Background sky -->
  <rect width="512" height="512" rx="108" fill="url(#sky)"/>

  <g clip-path="url(#rr)">
