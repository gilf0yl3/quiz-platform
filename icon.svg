    <!-- ── PERSON 5 ── -->
    <g fill="#182535">
      <circle cx="295" cy="323" r="17"/>
      <path d="M280,340 Q278,382 276,398 Q285,401 295,401 Q305,401 314,398 Q312,382 310,340 Q304,335 295,334 Q286,335 280,340Z"/>
      <path d="M280,398 Q276,420 273,441 Q279,443 286,443 Q289,434 295,422 Q301,434 304,443 Q311,443 317,441 Q314,420 310,398Z"/>
