      <path d="M242,338 Q240,380 238,396 Q247,399 257,399 Q267,399 276,396 Q274,380 272,338 Q266,333 257,332 Q248,333 242,338Z"/>
      <path d="M242,396 Q238,418 235,439 Q241,441 248,441 Q251,432 257,420 Q263,432 266,441 Q273,441 279,439 Q276,418 272,396Z"/>
      <path d="M242,346 Q231,360 229,374 Q235,376 238,372 Q240,360 243,349Z"/>
      <path d="M272,346 Q283,360 285,374 Q279,376 276,372 Q274,360 271,349Z"/>
