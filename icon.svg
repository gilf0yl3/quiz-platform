      <path d="M122,354 Q113,332 117,309 Q122,307 125,315 Q124,334 128,352Z"/>
      <!-- right arm -->
      <path d="M154,354 Q164,370 162,387 Q157,388 154,384 Q152,370 151,354Z"/>
