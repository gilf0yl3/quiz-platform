<!DOCTYPE html>
<html lang="en" data-screen="welcome">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trivia Night</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <canvas id="bg-canvas" aria-hidden="true"></canvas>

  <button id="btn-mute" class="btn-mute" title="Toggle sound" aria-label="Mute sound">🔊</button>

  <!-- ═══════════════════════════════════════════════════════════════
       SCREEN 1 — WELCOME
       ════════════════════════════════════════════════════════════════ -->
  <section id="screen-welcome">
    <div class="welcome-hero">
      <div class="welcome-icon">🎯</div>
      <h1>Trivia Night</h1>
      <p>Add all your players, then split into teams</p>
    </div>

    <div class="welcome-pool">
      <div class="member-add-row">
        <input type="text" id="pool-member-input" placeholder="Enter a player name…" autocomplete="off" />
        <button id="pool-add-btn" class="btn btn-ghost btn-sm">Add</button>
      </div>
      <div class="member-chips" id="pool-members"></div>
    </div>

    <div class="welcome-cta">
      <button id="btn-next" class="btn btn-primary" disabled>Next →</button>
    </div>
  </section>

  <!-- ═══════════════════════════════════════════════════════════════
       SCREEN 2 — TEAMS
       ════════════════════════════════════════════════════════════════ -->
  <section id="screen-teams">
    <div class="teams-screen-header">
      <h2>Your Teams</h2>
      <p>Happy with the split? Name your teams and start!</p>
    </div>

    <div class="split-grid">
      <div class="split-card">
        <input type="text" id="team1-name" class="team-name-input" placeholder="Team 1 name…" autocomplete="off" />
        <div class="split-members" id="split-team1-members"></div>
      </div>
      <div class="split-card">
        <input type="text" id="team2-name" class="team-name-input" placeholder="Team 2 name…" autocomplete="off" />
        <div class="split-members" id="split-team2-members"></div>
      </div>
    </div>

    <div class="teams-actions">
      <button id="btn-reshuffle" class="btn btn-ghost">🔀 Shuffle Again</button>
      <button id="btn-start-game" class="btn btn-primary" disabled>Start Game →</button>
    </div>
  </section>

  <!-- ═══════════════════════════════════════════════════════════════
       SCREEN 3 — GAME
       ════════════════════════════════════════════════════════════════ -->
  <section id="screen-game" data-phase="idle">

    <!-- Sticky scoreboard -->
    <div class="scoreboard">
      <div class="scoreboard-inner">
        <div class="score-team">
          <span class="score-value" id="sb-team1-score">0</span>
          <span class="score-team-name" id="sb-team1-name">Team 1</span>
        </div>
        <span class="score-divider">vs</span>
        <div class="score-team">
          <span class="score-team-name" id="sb-team2-name">Team 2</span>
          <span class="score-value" id="sb-team2-score">0</span>
        </div>
      </div>
    </div>

    <!-- Main content -->
    <div class="game-main">

      <!-- Meta row -->
      <div class="question-meta">
        <span class="question-counter" id="question-counter">Question 1 of 10</span>
        <span class="category-badge" id="category-label">Category</span>
      </div>

      <!-- Question card -->
      <div class="question-card">
        <p class="question-text" id="question-text">Loading question…</p>
        <div class="answer-label">Answer</div>
        <div class="answer-text" id="answer-text" aria-live="polite">—</div>
        <div class="hint-text" id="hint-text"></div>
      </div>

      <!-- Timer -->
      <div class="timer-section">
        <div class="timer-track">
          <div class="timer-bar" id="timer-bar"></div>
        </div>
        <div class="timer-label" id="timer-label">60s</div>
      </div>

      <!-- Phase-driven controls -->
      <div class="game-controls">

        <!-- idle: show Start Timer button -->
        <div class="phase-idle" style="gap:0.75rem">
          <button id="btn-start-timer" class="btn btn-primary">▶ Start Timer</button>
        </div>

        <!-- running: show Reveal Answer button -->
        <div class="phase-running" style="gap:0.75rem">
          <button id="btn-reveal" class="btn btn-ghost">Reveal Answer</button>
        </div>

        <!-- revealed: show award controls -->
        <div class="phase-revealed" style="flex-direction:column; align-items:center; gap:0.75rem; width:100%">
          <div class="award-label">Award point to</div>
          <div class="award-controls">
            <button id="award-btn-0" class="btn btn-primary">▲ Team 1</button>
            <button id="award-btn-1" class="btn btn-primary">▲ Team 2</button>
            <button id="award-btn-both" class="btn btn-primary">▲ Both Teams</button>
            <button id="award-btn-none" class="btn btn-ghost">Neither</button>
          </div>
        </div>

      </div>
    </div>
  </section>

  <!-- ═══════════════════════════════════════════════════════════════
       SCREEN 4 — RESULTS
       ════════════════════════════════════════════════════════════════ -->
  <section id="screen-results">

    <div class="results-header">
      <div class="result-banner" id="result-banner">Game Over!</div>
      <div class="result-score-display" id="result-score">0 – 0</div>
    </div>

    <div class="results-teams">
      <div class="result-team-card">
        <h2 id="result-team1-name">Team 1</h2>
        <div class="result-team-score" id="result-team1-score">0</div>
        <div class="result-team-members" id="result-team1-members"></div>
      </div>
      <div class="result-team-card">
        <h2 id="result-team2-name">Team 2</h2>
        <div class="result-team-score" id="result-team2-score">0</div>
        <div class="result-team-members" id="result-team2-members"></div>
      </div>
    </div>

    <details class="breakdown">
      <summary>Question Breakdown</summary>
      <ul class="breakdown-list" id="breakdown-list"></ul>
    </details>

    <button id="btn-new-game" class="btn btn-primary">New Game</button>

  </section>

  <script type="module" src="js/app.js"></script>
  <script src="js/bg.js"></script>
</body>
</html>
